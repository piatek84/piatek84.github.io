<body>

<div class="top">

<p class="subtitle">Compare two texts and see line-by-line differences — free, fast, and private.</p>

<main>
  <div class="inputs">
    <div class="col">
      <label for="inputA">Version 1</label>
      <textarea id="inputA" placeholder="Paste the original text here..."></textarea>
    </div>
    <div class="col">
      <label for="inputB">Version 2</label>
      <textarea id="inputB" placeholder="Paste the changed text here..."></textarea>
    </div>
  </div>

  <div class="buttons">
    <button class="action" id="compareBtn">Compare</button>
    <span class="stats" id="stats"></span>
  </div>

  <div class="output-wrap">

    <button class="copyBtn" id="copyBtn">Copy</button>
  </div>
</main>

<footer>

      <line x1="13.2" y1="2" x2="11.7" y2="6"/>
      <rect x="5" y="6" width="14" height="3" rx="1.4"/>
      <path d="M6 9 L7 20 Q7.2 21 8.2 21 L15.8 21 Q16.8 21 17 20 L18 9 Z"/>
      <line x1="6.7" y1="14" x2="17.3" y2="14"/>
    </svg>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(theme){
    if(theme === 'light'){
      root.setAttribute('data-theme','light');
      themeToggle.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      themeToggle.textContent = '🌙';
    }
  }

  const inputA = document.getElementById('inputA');
  const inputB = document.getElementById('inputB');
  const diffOutput = document.getElementById('diffOutput');
  const statsEl = document.getElementById('stats');

  function diffLines(a, b){
    const linesA = a.split('\n');
    const linesB = b.split('\n');
    const n = linesA.length, m = linesB.length;
    const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
    for(let i=n-1;i>=0;i--){
      for(let j=m-1;j>=0;j--){
        dp[i][j] = linesA[i] === linesB[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
      }
    }
    const result = [];
    let i=0, j=0;
    while(i<n && j<m){
      if(linesA[i] === linesB[j]){
        result.push({type:'same', text:linesA[i]});
        i++; j++;
      } else if(dp[i+1][j] >= dp[i][j+1]){
        result.push({type:'removed', text:linesA[i]});
        i++;
      } else {
        result.push({type:'added', text:linesB[j]});
        j++;
      }
    }
    while(i<n){ result.push({type:'removed', text:linesA[i]}); i++; }
    while(j<m){ result.push({type:'added', text:linesB[j]}); j++; }
    return result;
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Character-level diff between two strings (used to highlight only the
  // characters that changed within a modified line, not the whole line)
  function diffChars(a, b){
    const n = a.length, m = b.length;
    const dp = Array.from({length:n+1}, () => new Array(m+1).fill(0));
    for(let i=n-1;i>=0;i--){
      for(let j=m-1;j>=0;j--){
        dp[i][j] = a[i] === b[j] ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
      }
    }
    const segs = [];
    function push(type, ch){
      const last = segs[segs.length-1];
      if(last && last.type === type) last.text += ch;
      else segs.push({type, text:ch});
    }
    let i=0, j=0;
    while(i<n && j<m){
      if(a[i] === b[j]){ push('same', a[i]); i++; j++; }
      else if(dp[i+1][j] >= dp[i][j+1]){ push('removed', a[i]); i++; }
      else { push('added', b[j]); j++; }
    }
    while(i<n){ push('removed', a[i]); i++; }
    while(j<m){ push('added', b[j]); j++; }
    return segs;
  }

  function renderModifiedSide(segs, side){
    return segs
      .filter(s => side === 'left' ? s.type !== 'added' : s.type !== 'removed')
      .map(s => {
        const text = escapeHtml(s.text);
        if(s.type === 'same') return text;
        const cls = side === 'left' ? 'char-removed' : 'char-added';
        return `<mark class="${cls}">${text}</mark>`;
      })
      .join('');
  }

  // Pair up consecutive removed/added blocks into aligned side-by-side rows
  function buildRows(a, b){
    const flat = diffLines(a, b);
    const rows = [];
    let i = 0;
    while(i < flat.length){
      if(flat[i].type === 'same'){
        rows.push({type:'same', left:flat[i].text, right:flat[i].text});
        i++;
        continue;
      }
      const removedBuf = [];
      const addedBuf = [];
      while(i < flat.length && flat[i].type !== 'same'){
        if(flat[i].type === 'removed') removedBuf.push(flat[i].text);
        else addedBuf.push(flat[i].text);
        i++;
      }
      const max = Math.max(removedBuf.length, addedBuf.length);
      for(let k=0;k<max;k++){
        const left = k < removedBuf.length ? removedBuf[k] : null;
        const right = k < addedBuf.length ? addedBuf[k] : null;
        const type = (left !== null && right !== null) ? 'modified' : (left !== null ? 'removed' : 'added');
        rows.push({type, left, right});
      }
    }
    return rows;
  }

  document.getElementById('compareBtn').addEventListener('click', () => {
    if(inputA.value === '' && inputB.value === ''){
      diffOutput.innerHTML = '<span class="placeholder">Differences will appear here...</span>';
      statsEl.innerHTML = '';
      return;
    }

    const rows = buildRows(inputA.value, inputB.value);
    let added = 0, removed = 0;

    const body = rows.map(row => {
      let leftCls = 'left', rightCls = 'right';
      let leftText, rightText;

      if(row.type === 'removed'){
        leftCls += ' removed'; rightCls += ' empty'; removed++;
        leftText = escapeHtml(row.left) || '&nbsp;';
        rightText = '';
      } else if(row.type === 'added'){
        leftCls += ' empty'; rightCls += ' added'; added++;
        leftText = '';
        rightText = escapeHtml(row.right) || '&nbsp;';
      } else if(row.type === 'modified'){
        removed++; added++;
        const segs = diffChars(row.left, row.right);
        leftText = renderModifiedSide(segs, 'left') || '&nbsp;';
        rightText = renderModifiedSide(segs, 'right') || '&nbsp;';
      } else {
        leftText = escapeHtml(row.left) || '&nbsp;';
        rightText = escapeHtml(row.right) || '&nbsp;';
      }

      return `<tr data-type="${row.type}"><td class="${leftCls}">${leftText}</td><td class="${rightCls}">${rightText}</td></tr>`;
    }).join('');

    diffOutput.innerHTML = `<table class="diff-table"><thead><tr><th>Version 1</th><th>Version 2</th></tr></thead><tbody>${body}</tbody></table>`;
    statsEl.innerHTML = `<span class="added">+${added}</span> <span class="removed">−${removed}</span>`;
  });

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', async () => {
    const rows = diffOutput.querySelectorAll('tbody tr');
    if(!rows.length) return;
    let text = '';
    rows.forEach(row => {
      const type = row.dataset.type;
      const left = row.children[0];
      const right = row.children[1];
      if(type === 'removed') text += '- ' + left.textContent + '\n';
      else if(type === 'added') text += '+ ' + right.textContent + '\n';
      else if(type === 'modified'){ text += '- ' + left.textContent + '\n' + '+ ' + right.textContent + '\n'; }
      else text += '  ' + left.textContent + '\n';
    });
    try {
      await navigator.clipboard.writeText(text);
      const original = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = original, 1200);
    } catch(e) {
      console.error(e);
    }
  });
</script>
