<style>

<body>

<div class="top">
  <div class="top-left">
    <a class="toggle" href="index.html" title="Back to index">←</a>
    <h1>JSON Beautifier</h1>
  </div>
  <button class="toggle" id="themeToggle" title="Toggle theme">🌙</button>
</div>

<p class="subtitle">Format, validate, and minify JSON — free, fast, and private.</p>

<main>
  <textarea id="input" placeholder='Paste your JSON here, e.g. {"a":1,"b":[2,3]}'></textarea>

  <div class="buttons">
    <button class="action" id="beautifyBtn">Beautify</button>
    <button class="action secondary" id="minifyBtn">Minify</button>
  </div>

  <div class="output-wrap">
    <textarea id="output" placeholder="Result..." readonly></textarea>
    <button class="copyBtn" id="copyBtn">Copy</button>
  </div>
</main>

<footer>

      <line x1="13.2" y1="2" x2="11.7" y2="6"/>
      <rect x="5" y="6" width="14" height="3" rx="1.4"/>
      <path d="M6 9 L7 20 Q7.2 21 8.2 21 L15.8 21 Q16.8 21 17 20 L18 9 Z"/>
      <line x1="6.7" y1="14" x2="17.3" y2="14"/>
    </svg>
    Buy me a coffee
  </a>
</footer>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(theme){
    if(theme === 'light'){
      root.setAttribute('data-theme','light');
      themeToggle.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      themeToggle.textContent = '🌙';
    }
  }

  const input = document.getElementById('input');
  const output = document.getElementById('output');

  function showError(e){
    output.classList.add('error');
    output.value = 'Error: invalid JSON — ' + e.message;
  }

  document.getElementById('beautifyBtn').addEventListener('click', () => {
    output.classList.remove('error');
    try {
      const parsed = JSON.parse(input.value);
      output.value = JSON.stringify(parsed, null, 2);
    } catch(e) {
      showError(e);
    }
  });

  document.getElementById('minifyBtn').addEventListener('click', () => {
    output.classList.remove('error');
    try {
      const parsed = JSON.parse(input.value);
      output.value = JSON.stringify(parsed);
    } catch(e) {
      showError(e);
    }
  });

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', async () => {
    if (!output.value) return;
    try {
      await navigator.clipboard.writeText(output.value);
      const original = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = original, 1200);
    } catch(e) {
      output.select();
      document.execCommand('copy');
    }
  });
</script>

<script>
  // Double-click anywhere to toggle fullscreen (double-click again to exit).
  document.addEventListener('dblclick', () => {
    if(!document.fullscreenElement && !document.webkitFullscreenElement &&
       !document.mozFullScreenElement && !document.msFullscreenElement){
      const elem = document.documentElement;
      if(elem.requestFullscreen) elem.requestFullscreen();
      else if(elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if(elem.mozRequestFullScreen) elem.mozRequestFullScreen();
      else if(elem.msRequestFullscreen) elem.msRequestFullscreen();
    } else {
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if(document.mozCancelFullScreen) document.mozCancelFullScreen();
      else if(document.msExitFullscreen) document.msExitFullscreen();
    }
  });
</script>
