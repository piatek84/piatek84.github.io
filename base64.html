<style>
  :root{
    --bg:#0f0f10;
    --panel:#1a1a1c;
    --border:#2c2c2e;
    --text:#e8e8ea;
    --muted:#8a8a8e;
    --accent:#e8e8ea;
  }
  [data-theme="light"]{
    --bg:#fafafa;
    --panel:#ffffff;
    --border:#e2e2e4;
    --text:#1a1a1c;
    --muted:#6b6b6f;
    --accent:#1a1a1c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 24px;
    transition:background .2s,color .2s;
  }
  .top{
    width:100%;
    max-width:640px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
  }
  .top h1{
    margin:0;
    max-width:none;
  }
  .toggle{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:8px;
    width:36px;
    height:36px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }
  .toggle:hover{color:var(--text);border-color:var(--muted);}
  h1{
    width:100%;
    max-width:640px;
    margin:0 0 20px;
    font-size:18px;
    font-weight:600;
    letter-spacing:.2px;
  }
  .subtitle{
    width:100%;
    max-width:640px;
    margin:-10px 0 20px;
    font-size:13px;
    color:var(--muted);
  }
  main{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  textarea{
    width:100%;
    min-height:140px;
    resize:vertical;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:14px;
    line-height:1.5;
    outline:none;
  }
  textarea:focus{border-color:var(--muted);}
  textarea::placeholder{color:var(--muted);}
  .buttons{
    display:flex;
    justify-content:center;
    gap:10px;
  }
  button.action{
    background:var(--text);
    color:var(--bg);
    border:none;
    border-radius:8px;
    padding:10px 22px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  button.action:hover{opacity:.85;}
  button.action.secondary{
    background:none;
    color:var(--text);
    border:1px solid var(--border);
  }
  footer{
    width:100%;
    max-width:640px;
    margin-top:40px;
    display:flex;
    justify-content:flex-end;
  }
  .kofi{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 14px;
    border-radius:999px;
    color:var(--muted);
    text-decoration:none;
    border:1px solid var(--border);
    font-size:13px;
    font-weight:500;
    transition:color .15s,border-color .15s;
  }
  .kofi:hover{color:var(--text);border-color:var(--muted);}
  .kofi svg{width:16px;height:16px;flex-shrink:0;}
  .output-wrap{
    position:relative;
  }
  .copyBtn{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:6px;
    padding:5px 10px;
    font-size:12px;
    cursor:pointer;
  }
  .copyBtn:hover{color:var(--text);border-color:var(--muted);}
</style>
</head>
<body>

<div class="top">
  <h1>Base64</h1>
  <button class="toggle" id="themeToggle" title="Toggle theme">🌙</button>
</div>

<p class="subtitle">Encode text to Base64 or decode Base64 to text — free, fast, and private.</p>

<main>
  <textarea id="input" placeholder="Type or paste text here..."></textarea>

  <div class="buttons">
    <button class="action" id="encodeBtn">Encode</button>
    <button class="action secondary" id="decodeBtn">Decode</button>
  </div>

  <div class="output-wrap">
    <textarea id="output" placeholder="Result..." readonly></textarea>
    <button class="copyBtn" id="copyBtn">Copy</button>
  </div>
</main>

<footer>
  <a class="kofi" href="https://ko-fi.com/jankorwer" target="_blank" rel="noopener" title="Buy me a coffee">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="13.2" y1="2" x2="11.7" y2="6"/>
      <rect x="5" y="6" width="14" height="3" rx="1.4"/>
      <path d="M6 9 L7 20 Q7.2 21 8.2 21 L15.8 21 Q16.8 21 17 20 L18 9 Z"/>
      <line x1="6.7" y1="14" x2="17.3" y2="14"/>
    </svg>
    Buy me a coffee
  </a>
</footer>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(theme){
    if(theme === 'light'){
      root.setAttribute('data-theme','light');
      themeToggle.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      themeToggle.textContent = '🌙';
    }
  }

  const input = document.getElementById('input');
  const output = document.getElementById('output');

  document.getElementById('encodeBtn').addEventListener('click', () => {
    try {
      output.value = btoa(unescape(encodeURIComponent(input.value)));
    } catch(e) {
      output.value = 'Error encoding';
    }
  });

  document.getElementById('decodeBtn').addEventListener('click', () => {
    try {
      output.value = decodeURIComponent(escape(atob(input.value)));
    } catch(e) {
      output.value = 'Error: invalid Base64 input';
    }
  });

  const copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', async () => {
    if (!output.value) return;
    try {
      await navigator.clipboard.writeText(output.value);
      const original = copyBtn.textContent;
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = original, 1200);
    } catch(e) {
      output.select();
      document.execCommand('copy');
    }
  });
</script>

</body>
