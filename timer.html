<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(theme){
    if(theme === 'light'){
      root.setAttribute('data-theme','light');
      themeToggle.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      themeToggle.textContent = '🌙';
    }
  }
</script>

<script>
  const timeEl = document.getElementById('time');
  const progressBar = document.getElementById('progressBar');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const hoursInput = document.getElementById('hoursInput');
  const minutesInput = document.getElementById('minutesInput');
  const secondsInput = document.getElementById('secondsInput');

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function getConfiguredSeconds(){
    const h = clamp(parseInt(hoursInput.value, 10) || 0, 0, 99);
    const m = clamp(parseInt(minutesInput.value, 10) || 0, 0, 59);
    const s = clamp(parseInt(secondsInput.value, 10) || 0, 0, 59);
    return h * 3600 + m * 60 + s;
  }

  let totalSeconds = getConfiguredSeconds();
  let remainingSeconds = totalSeconds;
  let running = false;
  let endTime = null;
  let showHours = totalSeconds >= 3600;

  const tickerWorker = (() => {
    const workerCode = `
      let intervalId = null;
      self.onmessage = function(e){
        if(e.data === 'start'){
          clearInterval(intervalId);
          intervalId = setInterval(() => self.postMessage('tick'), 250);
        } else if(e.data === 'stop'){
          clearInterval(intervalId);
        }
      };
    `;
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    return new Worker(URL.createObjectURL(blob));
  })();
  tickerWorker.onmessage = () => { if(running) tick(); };

  function pad(n){ return String(n).padStart(2, '0'); }

  function formatTime(seconds){
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    return showHours ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }

  function updateDisplay(){
    timeEl.textContent = formatTime(remainingSeconds);
    const pct = totalSeconds > 0 ? ((totalSeconds - remainingSeconds) / totalSeconds) * 100 : 0;
    progressBar.style.width = pct + '%';
    document.title = running ? `${formatTime(remainingSeconds)} — Timer` : 'Countdown Timer Online — Free, Fast, No Ads';
  }

  function tick(){
    remainingSeconds = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    updateDisplay();
    if(remainingSeconds <= 0){
      pause();
      handleComplete();
    }
  }

  function handleComplete(){
    playChime();
    document.title = "⏰ Time's up! — Timer";
    showToast("⏰ Time's up!");
  }

  let toastEl = null;
  let toastTimer = null;
  function showToast(message){
    if(!toastEl){
      toastEl = document.createElement('div');
      toastEl.style.position = 'fixed';
      toastEl.style.bottom = '24px';
      toastEl.style.left = '50%';
      toastEl.style.transform = 'translateX(-50%) translateY(20px)';
      toastEl.style.background = 'var(--panel)';
      toastEl.style.color = 'var(--text)';
      toastEl.style.border = '1px solid var(--border)';
      toastEl.style.borderRadius = '10px';
      toastEl.style.padding = '12px 20px';
      toastEl.style.fontSize = '14px';
      toastEl.style.fontWeight = '600';
      toastEl.style.opacity = '0';
      toastEl.style.transition = 'opacity .2s, transform .2s';
      toastEl.style.pointerEvents = 'none';
      toastEl.style.zIndex = '999';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = message;
    requestAnimationFrame(() => {
      toastEl.style.opacity = '1';
      toastEl.style.transform = 'translateX(-50%) translateY(0)';
    });
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.style.opacity = '0';
      toastEl.style.transform = 'translateX(-50%) translateY(20px)';
    }, 4000);
  }

  function playChime(){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const masterGain = ctx.createGain();
      masterGain.gain.value = 0.9;
      masterGain.connect(ctx.destination);

      const notes = [880, 1108.73, 1318.51, 1760];
      notes.forEach((freq, i) => {
        const startTime = ctx.currentTime + i * 0.18;
        const duration = 1.0;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(masterGain);
        osc.type = 'sine';
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.5, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.start(startTime);
        osc.stop(startTime + duration);
      });

      // Repeat the chime once more so it's hard to miss
      notes.forEach((freq, i) => {
        const startTime = ctx.currentTime + 1.4 + i * 0.18;
        const duration = 1.0;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(masterGain);
        osc.type = 'sine';
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.5, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.start(startTime);
        osc.stop(startTime + duration);
      });
    } catch(e) {}
  }

  const keepAliveAudio = createKeepAliveAudio();

  function createKeepAliveAudio(){
    const sampleRate = 8000;
    const frameCount = sampleRate; // 1 second, looped
    const buffer = new ArrayBuffer(44 + frameCount * 2);
    const view = new DataView(buffer);

    function writeString(offset, str){
      for(let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + frameCount * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, frameCount * 2, true);

    for(let i = 0; i < frameCount; i++){
      const sample = Math.round((Math.random() * 2 - 1) * 300);
      view.setInt16(44 + i * 2, sample, true);
    }

    const blob = new Blob([buffer], { type: 'audio/wav' });
    const audio = new Audio(URL.createObjectURL(blob));
    audio.loop = true;
    audio.volume = 0.03;
    return audio;
  }

  function start(){
    if(running) return;
    if(remainingSeconds <= 0){
      totalSeconds = getConfiguredSeconds();
      if(totalSeconds <= 0) return;
      showHours = totalSeconds >= 3600;
      remainingSeconds = totalSeconds;
    }
    running = true;
    startBtn.textContent = 'Pause';
    endTime = Date.now() + remainingSeconds * 1000;
    tickerWorker.postMessage('start');
    keepAliveAudio.play().catch(() => {});
  }

  function pause(){
    running = false;
    startBtn.textContent = 'Start';
    tickerWorker.postMessage('stop');
    keepAliveAudio.pause();
    updateDisplay();
  }

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && running){
      tick();
    }
  });

  startBtn.addEventListener('click', () => {
    if(running) pause();
    else start();
  });

  resetBtn.addEventListener('click', () => {
    pause();
    totalSeconds = getConfiguredSeconds();
    showHours = totalSeconds >= 3600;
    remainingSeconds = totalSeconds;
    updateDisplay();
  });

  [hoursInput, minutesInput, secondsInput].forEach(input => {
    input.addEventListener('change', () => {
      if(!running){
        totalSeconds = getConfiguredSeconds();
        showHours = totalSeconds >= 3600;
        remainingSeconds = totalSeconds;
        updateDisplay();
      }
    });
  });

  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if(running) pause();
      const seconds = parseInt(btn.dataset.seconds, 10);
      hoursInput.value = Math.floor(seconds / 3600);
      minutesInput.value = Math.floor((seconds % 3600) / 60);
      secondsInput.value = seconds % 60;
      totalSeconds = seconds;
      showHours = totalSeconds >= 3600;
      remainingSeconds = totalSeconds;
      updateDisplay();
    });
  });

  updateDisplay();
</script>

<script>
  // Double-click anywhere to toggle fullscreen (double-click again to exit).
  // Needs a fast double-click on a non-interactive element, so selecting text
  // or clicking a button/input doesn't accidentally trigger fullscreen.
  let lastClickTime = 0;
  let lastClickTarget = null;
  document.addEventListener('click', (e) => {
    if(e.target.closest('a, button, input, textarea, select, label, [contenteditable]')){
      lastClickTime = 0;
      return;
    }
    const now = Date.now();
    if(now - lastClickTime < 300 && lastClickTarget === e.target){
      lastClickTime = 0;
      if(!document.fullscreenElement && !document.webkitFullscreenElement &&
         !document.mozFullScreenElement && !document.msFullscreenElement){
        const elem = document.documentElement;
        if(elem.requestFullscreen) elem.requestFullscreen();
        else if(elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if(elem.mozRequestFullScreen) elem.mozRequestFullScreen();
        else if(elem.msRequestFullscreen) elem.msRequestFullscreen();
      } else {
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if(document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if(document.msExitFullscreen) document.msExitFullscreen();
      }
    } else {
      lastClickTime = now;
      lastClickTarget = e.target;
    }
  });
</script>
