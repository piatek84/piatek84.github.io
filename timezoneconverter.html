<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(theme){
    if(theme === 'light'){
      root.setAttribute('data-theme','light');
      themeToggle.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      themeToggle.textContent = '🌙';
    }
  }
</script>

<script>
  // Fallback IANA zone list used only if Intl.supportedValuesOf('timeZone') is unavailable
  // (older browsers). The IANA tz database identifiers below are public-domain data.
  const FALLBACK_ZONES = [
    'UTC','Africa/Abidjan','Africa/Accra','Africa/Addis_Ababa','Africa/Algiers','Africa/Cairo',
    'Africa/Casablanca','Africa/Johannesburg','Africa/Khartoum','Africa/Lagos','Africa/Nairobi',
    'Africa/Tripoli','Africa/Tunis','America/Anchorage','America/Argentina/Buenos_Aires',
    'America/Bogota','America/Caracas','America/Chicago','America/Denver','America/Halifax',
    'America/Lima','America/Los_Angeles','America/Mexico_City','America/New_York',
    'America/Noronha','America/Phoenix','America/Santiago','America/Sao_Paulo','America/St_Johns',
    'America/Toronto','America/Vancouver','America/Winnipeg','Antarctica/Palmer',
    'Asia/Almaty','Asia/Amman','Asia/Baghdad','Asia/Baku','Asia/Bangkok','Asia/Beirut',
    'Asia/Colombo','Asia/Dhaka','Asia/Dubai','Asia/Ho_Chi_Minh','Asia/Hong_Kong','Asia/Istanbul',
    'Asia/Jakarta','Asia/Jerusalem','Asia/Kabul','Asia/Karachi','Asia/Kathmandu','Asia/Kolkata',
    'Asia/Kuala_Lumpur','Asia/Kuwait','Asia/Manila','Asia/Riyadh','Asia/Seoul','Asia/Shanghai',
    'Asia/Singapore','Asia/Taipei','Asia/Tehran','Asia/Tokyo','Asia/Yangon',
    'Atlantic/Azores','Atlantic/Cape_Verde','Atlantic/Reykjavik',
    'Australia/Adelaide','Australia/Brisbane','Australia/Darwin','Australia/Melbourne',
    'Australia/Perth','Australia/Sydney',
    'Europe/Amsterdam','Europe/Athens','Europe/Belgrade','Europe/Berlin','Europe/Brussels',
    'Europe/Bucharest','Europe/Budapest','Europe/Copenhagen','Europe/Dublin','Europe/Helsinki',
    'Europe/Istanbul','Europe/Lisbon','Europe/London','Europe/Madrid','Europe/Moscow',
    'Europe/Oslo','Europe/Paris','Europe/Prague','Europe/Rome','Europe/Stockholm',
    'Europe/Vienna','Europe/Warsaw','Europe/Zurich',
    'Indian/Maldives','Indian/Mauritius',
    'Pacific/Auckland','Pacific/Fiji','Pacific/Guam','Pacific/Honolulu','Pacific/Midway',
    'Pacific/Noumea','Pacific/Tongatapu'
  ];

  function pad(n){ return String(n).padStart(2,'0'); }

  function getZoneList(){
    try {
      if (typeof Intl.supportedValuesOf === 'function') {
        const zones = Intl.supportedValuesOf('timeZone');
        if (zones && zones.length) return zones;
      }
    } catch(e){}
    return FALLBACK_ZONES;
  }

  function buildZoneOptions(zones){
    const groups = {};
    zones.forEach(z => {
      if (z === 'UTC') return;
      const region = z.includes('/') ? z.split('/')[0] : 'Other';
      (groups[region] = groups[region] || []).push(z);
    });
    const regionNames = Object.keys(groups).sort();
    let html = `<option value="UTC">UTC</option>`;
    regionNames.forEach(region => {
      html += `<optgroup label="${region}">`;
      groups[region].sort().forEach(z => {
        const label = z.split('/').slice(1).join('/').replace(/_/g, ' ') || z;
        html += `<option value="${z}">${label}</option>`;
      });
      html += `</optgroup>`;
    });
    return html;
  }

  function dtLocalString(y, mo, d, h, mi){
    return `${y}-${pad(mo)}-${pad(d)}T${pad(h)}:${pad(mi)}`;
  }

  function parseDtLocal(value){
    const [datePart, timePart] = value.split('T');
    const [y, mo, d] = datePart.split('-').map(Number);
    const [h, mi] = timePart.split(':').map(Number);
    return { y, mo, d, h, mi };
  }

  function getZoneOffsetMinutes(date, timeZone){
    const dtf = new Intl.DateTimeFormat('en-US', {
      timeZone, hourCycle: 'h23',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    const parts = dtf.formatToParts(date).reduce((acc, p) => {
      if (p.type !== 'literal') acc[p.type] = p.value;
      return acc;
    }, {});
    const asUTC = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute, +parts.second);
    return Math.round((asUTC - date.getTime()) / 60000);
  }

  function formatInZone(date, timeZone){
    const dtf = new Intl.DateTimeFormat('en-US', {
      timeZone, hourCycle: 'h23',
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
    const parts = dtf.formatToParts(date).reduce((acc, p) => {
      if (p.type !== 'literal') acc[p.type] = p.value;
      return acc;
    }, {});
    return dtLocalString(+parts.year, +parts.month, +parts.day, +parts.hour, +parts.minute);
  }

  function zonedWallTimeToUtcDate(parts, timeZone){
    const { y, mo, d, h, mi } = parts;
    let guessMs = Date.UTC(y, mo - 1, d, h, mi);
    for (let i = 0; i < 2; i++) {
      const offsetMin = getZoneOffsetMinutes(new Date(guessMs), timeZone);
      guessMs = Date.UTC(y, mo - 1, d, h, mi) - offsetMin * 60000;
    }
    return new Date(guessMs);
  }

  function offsetLabel(date, timeZone){
    const offsetMin = getZoneOffsetMinutes(date, timeZone);
    const sign = offsetMin >= 0 ? '+' : '-';
    const abs = Math.abs(offsetMin);
    const hh = pad(Math.floor(abs / 60));
    const mm = pad(abs % 60);
    let abbr = '';
    try {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone, timeZoneName: 'short' }).formatToParts(date);
      abbr = parts.find(p => p.type === 'timeZoneName')?.value || '';
    } catch(e){}
    return `<strong>UTC${sign}${hh}:${mm}</strong>${abbr ? ' · ' + abbr : ''}`;
  }

  const zoneASelect = document.getElementById('zoneASelect');
  const zoneAInput = document.getElementById('zoneAInput');
  const offsetAEl = document.getElementById('offsetAEl');
  const zoneBSelect = document.getElementById('zoneBSelect');
  const zoneBInput = document.getElementById('zoneBInput');
  const offsetBEl = document.getElementById('offsetBEl');
  const diffEl = document.getElementById('diffEl');
  const swapBtn = document.getElementById('swapBtn');
  const nowBtn = document.getElementById('nowBtn');

  const zones = getZoneList();
  const zoneOptionsHtml = buildZoneOptions(zones);
  zoneASelect.innerHTML = zoneOptionsHtml;
  zoneBSelect.innerHTML = zoneOptionsHtml;

  let browserZone = 'UTC';
  try { browserZone = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC'; } catch(e){}

  zoneASelect.value = 'UTC';

  zoneBSelect.value = browserZone;
  if (zoneBSelect.value !== browserZone) zoneBSelect.value = 'UTC';

  let currentInstant = new Date();

  function zoneLabel(z){
    if (z === 'UTC') return 'UTC';
    return z.split('/').pop().replace(/_/g, ' ');
  }

  function updateDiff(){
    const offA = getZoneOffsetMinutes(currentInstant, zoneASelect.value);
    const offB = getZoneOffsetMinutes(currentInstant, zoneBSelect.value);
    const diff = offB - offA;
    if (diff === 0) {
      diffEl.innerHTML = 'Same offset';
      return;
    }
    const sign = diff > 0 ? 'ahead of' : 'behind';
    const abs = Math.abs(diff);
    const hh = Math.floor(abs / 60), mm = abs % 60;
    const parts = [];
    if (hh) parts.push(`${hh}h`);
    if (mm) parts.push(`${mm}m`);
    diffEl.innerHTML = `<strong>${zoneLabel(zoneBSelect.value)}</strong> is ${parts.join(' ')} ${sign} <strong>${zoneLabel(zoneASelect.value)}</strong>`;
  }

  function syncFromInstant(){
    zoneAInput.value = formatInZone(currentInstant, zoneASelect.value);
    offsetAEl.innerHTML = offsetLabel(currentInstant, zoneASelect.value);
    zoneBInput.value = formatInZone(currentInstant, zoneBSelect.value);
    offsetBEl.innerHTML = offsetLabel(currentInstant, zoneBSelect.value);
    updateDiff();
  }

  zoneAInput.addEventListener('change', () => {
    if (!zoneAInput.value) return;
    const parts = parseDtLocal(zoneAInput.value);
    currentInstant = zonedWallTimeToUtcDate(parts, zoneASelect.value);
    syncFromInstant();
  });

  zoneBInput.addEventListener('change', () => {
    if (!zoneBInput.value) return;
    const parts = parseDtLocal(zoneBInput.value);
    currentInstant = zonedWallTimeToUtcDate(parts, zoneBSelect.value);
    syncFromInstant();
  });

  zoneASelect.addEventListener('change', syncFromInstant);
  zoneBSelect.addEventListener('change', syncFromInstant);

  swapBtn.addEventListener('click', () => {
    const a = zoneASelect.value;
    zoneASelect.value = zoneBSelect.value;
    zoneBSelect.value = a;
    syncFromInstant();
  });

  nowBtn.addEventListener('click', () => {
    currentInstant = new Date();
    syncFromInstant();
  });

  syncFromInstant();
</script>

<script>
  // Double-click anywhere to toggle fullscreen (double-click again to exit).
  document.addEventListener('dblclick', () => {
    if(!document.fullscreenElement && !document.webkitFullscreenElement &&
       !document.mozFullScreenElement && !document.msFullscreenElement){
      const elem = document.documentElement;
      if(elem.requestFullscreen) elem.requestFullscreen();
      else if(elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      else if(elem.mozRequestFullScreen) elem.mozRequestFullScreen();
      else if(elem.msRequestFullscreen) elem.msRequestFullscreen();
    } else {
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if(document.mozCancelFullScreen) document.mozCancelFullScreen();
      else if(document.msExitFullscreen) document.msExitFullscreen();
    }
  });
</script>
