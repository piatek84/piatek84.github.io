<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(theme){
    if(theme === 'light'){
      root.setAttribute('data-theme','light');
      themeToggle.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      themeToggle.textContent = '🌙';
    }
  }
</script>

<script>
  const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const LOWER = 'abcdefghijklmnopqrstuvwxyz';
  const NUMBERS = '0123456789';
  const SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';
  const AMBIGUOUS_CHARS = '0O1lI';

  const passwordDisplay = document.getElementById('passwordDisplay');
  const copyBtn = document.getElementById('copyBtn');
  const strengthFill = document.getElementById('strengthFill');
  const strengthLabel = document.getElementById('strengthLabel');
  const generateBtn = document.getElementById('generateBtn');
  const lengthInput = document.getElementById('lengthInput');
  const lengthSlider = document.getElementById('lengthSlider');
  const excludeAmbiguous = document.getElementById('excludeAmbiguous');

  let currentPassword = '';

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function secureRandomInt(max){
    const arr = new Uint32Array(1);
    const limit = Math.floor(0xFFFFFFFF / max) * max;
    let val;
    do {
      crypto.getRandomValues(arr);
      val = arr[0];
    } while (val >= limit);
    return val % max;
  }

  function getCategoryPools(){
    const defs = [
      { type: 'upper', chars: UPPER },
      { type: 'lower', chars: LOWER },
      { type: 'numbers', chars: NUMBERS },
      { type: 'symbols', chars: SYMBOLS }
    ];
    const excludeAmbig = excludeAmbiguous.checked;
    const categories = [];
    defs.forEach(d => {
      const btn = document.querySelector(`[data-type="${d.type}"]`);
      if (!btn.classList.contains('active')) return;
      let chars = d.chars;
      if (excludeAmbig) {
        chars = chars.split('').filter(c => !AMBIGUOUS_CHARS.includes(c)).join('');
      }
      if (chars.length > 0) categories.push({ type: d.type, chars });
    });
    return categories;
  }

  function generatePassword(length, categories){
    const fullPool = categories.map(c => c.chars).join('');
    const chars = categories.slice(0, length).map(c => c.chars[secureRandomInt(c.chars.length)]);
    for (let i = chars.length; i < length; i++) {
      chars.push(fullPool[secureRandomInt(fullPool.length)]);
    }
    for (let i = chars.length - 1; i > 0; i--) {
      const j = secureRandomInt(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    return chars.join('');
  }

  function updateStrength(length, poolSize){
    if (poolSize === 0) {
      strengthFill.style.width = '0%';
      strengthFill.style.background = 'transparent';
      strengthLabel.textContent = '—';
      return;
    }
    const entropy = length * Math.log2(poolSize);
    let label, color, pct;
    if (entropy < 28) { label = 'Weak'; color = '#c65b5b'; pct = 25; }
    else if (entropy < 36) { label = 'Fair'; color = '#c99a4a'; pct = 50; }
    else if (entropy < 60) { label = 'Good'; color = '#9ab55a'; pct = 75; }
    else { label = 'Strong'; color = '#4a9c6f'; pct = 100; }
    strengthFill.style.width = pct + '%';
    strengthFill.style.background = color;
    strengthLabel.textContent = `${label} (${Math.round(entropy)} bits)`;
  }

  function regenerate(){
    const length = clamp(parseInt(lengthInput.value, 10) || 16, 4, 64);
    const categories = getCategoryPools();

    if (categories.length === 0) {
      currentPassword = '';
      passwordDisplay.textContent = 'Select at least one character type';
      passwordDisplay.classList.add('empty');
      copyBtn.disabled = true;
      updateStrength(0, 0);
      return;
    }

    passwordDisplay.classList.remove('empty');
    const poolSize = categories.reduce((sum, c) => sum + c.chars.length, 0);
    currentPassword = generatePassword(length, categories);
    passwordDisplay.textContent = currentPassword;
    copyBtn.disabled = false;
    updateStrength(length, poolSize);
  }

  async function copyToClipboard(text){
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (e2) {
        return false;
      }
    }
  }

  document.querySelectorAll('[data-type]').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('active');
      regenerate();
    });
  });

  lengthInput.addEventListener('input', () => {
    lengthSlider.value = lengthInput.value;
    regenerate();
  });
  lengthInput.addEventListener('change', () => {
    lengthInput.value = clamp(parseInt(lengthInput.value, 10) || 16, 4, 64);
    lengthSlider.value = lengthInput.value;
    regenerate();
  });
  lengthSlider.addEventListener('input', () => {
    lengthInput.value = lengthSlider.value;
    regenerate();
  });

  excludeAmbiguous.addEventListener('change', regenerate);
  generateBtn.addEventListener('click', regenerate);

  copyBtn.addEventListener('click', async () => {
    if (!currentPassword) return;
    const ok = await copyToClipboard(currentPassword);
    const original = copyBtn.textContent;
    copyBtn.textContent = ok ? '✓' : '⚠';
    setTimeout(() => { copyBtn.textContent = '📋'; }, 1200);
  });

  regenerate();
</script>

<script>
  // Double-click anywhere to toggle fullscreen (double-click again to exit).
  // Needs a fast double-click on a non-interactive element, so selecting text
  // or clicking a button/input doesn't accidentally trigger fullscreen.
  let lastClickTime = 0;
  let lastClickTarget = null;
  document.addEventListener('click', (e) => {
    if(e.target.closest('a, button, input, textarea, select, label, [contenteditable]')){
      lastClickTime = 0;
      return;
    }
    const now = Date.now();
    if(now - lastClickTime < 300 && lastClickTarget === e.target){
      lastClickTime = 0;
      if(!document.fullscreenElement && !document.webkitFullscreenElement &&
         !document.mozFullScreenElement && !document.msFullscreenElement){
        const elem = document.documentElement;
        if(elem.requestFullscreen) elem.requestFullscreen();
        else if(elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if(elem.mozRequestFullScreen) elem.mozRequestFullScreen();
        else if(elem.msRequestFullscreen) elem.msRequestFullscreen();
      } else {
        if(document.exitFullscreen) document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if(document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if(document.msExitFullscreen) document.msExitFullscreen();
      }
    } else {
      lastClickTime = now;
      lastClickTarget = e.target;
    }
  });
</script>
