<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root, [data-theme="dark"] {
            --bg-dark: #0a0a0a;
            --bg-medium: #1a1a1a;
            --bg-light: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent: #404040;
            --border: #333333;
            --green: #00ff00;
            --body-bg-start: #0a0a0a;
            --body-bg-end: #1a1a1a;
            --shadow: rgba(0,0,0,0.5);
            --shadow-light: rgba(0,0,0,0.3);
            --inset: rgba(255,255,255,0.05);
        }

        [data-theme="light"] {
            --bg-dark: #f0f0f0;
            --bg-medium: #ffffff;
            --bg-light: #e8e8e8;
            --text-primary: #111111;
            --text-secondary: #555555;
            --accent: #cccccc;
            --border: #dddddd;
            --green: #007a00;
            --body-bg-start: #e8e8e8;
            --body-bg-end: #f5f5f5;
            --shadow: rgba(0,0,0,0.12);
            --shadow-light: rgba(0,0,0,0.08);
            --inset: rgba(0,0,0,0.02);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--body-bg-start) 0%, var(--body-bg-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            transition: background 0.35s ease, color 0.35s ease;
        }

        .container { max-width: 900px; margin: 0 auto; animation: fadeIn 0.8s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* THEME TOGGLE */
        .theme-toggle-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 2px solid var(--border);
            border-radius: 10px;
            background: var(--bg-medium);
            color: var(--text-primary);
            font-size: 1.1rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px var(--shadow-light);
        }

        .back-link:hover {
            border-color: var(--green);
            color: var(--green);
            transform: translateY(-1px);
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            border: 2px solid var(--border);
            border-radius: 999px;
            background: var(--bg-medium);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px var(--shadow-light);
        }

        .theme-toggle:hover {
            border-color: var(--green);
            color: var(--green);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--shadow-light);
        }

        .theme-toggle .toggle-icon { font-size: 1rem; transition: transform 0.5s ease; }
        .theme-toggle:hover .toggle-icon { transform: rotate(20deg); }

        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -1px; color: var(--green); }
        .subtitle { color: var(--text-secondary); font-size: 0.9rem; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }

        .actions { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }

        button {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }

        .btn-primary { background: var(--text-primary); color: var(--bg-dark); border-color: var(--text-primary); flex: 1; min-width: 150px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--shadow); background: var(--green); color: var(--bg-dark); border-color: var(--green); }
        .btn-secondary { background: var(--bg-medium); color: var(--text-primary); border: 2px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-light); border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 16px var(--shadow-light); }

        .prompt-form {
            background: var(--bg-medium);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 20px 60px var(--shadow), inset 0 1px 0 var(--inset);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            transition: background 0.35s ease;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--green); background: var(--bg-light); }
        input[type="text"]::placeholder, textarea::placeholder { color: var(--text-secondary); }
        textarea { resize: vertical; min-height: 120px; }

        .prompts-list { display: grid; gap: 1rem; }

        .prompt-card {
            background: var(--bg-medium);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow-light);
            transition: all 0.3s ease;
            border: 1px solid var(--border);
        }

        .prompt-card:hover { transform: translateY(-4px); box-shadow: 0 12px 35px var(--shadow); border-color: var(--green); }
        .prompt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
        .prompt-title { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); }
        .prompt-actions { display: flex; gap: 0.5rem; }

        .btn-icon {
            background: var(--bg-light);
            border: 1px solid var(--border);
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-size: 1.3rem;
            line-height: 1;
            color: var(--text-primary);
        }

        .btn-icon.edit-icon { display: inline-block; transform: scaleX(-1); }
        .btn-icon:hover { background: var(--accent); transform: scale(1.05); }
        .btn-icon.edit-icon:hover { transform: scaleX(-1) scale(1.05); }
        .btn-delete:hover { background: #ff4444; border-color: #ff4444; color: #fff; }

        .prompt-content { color: var(--text-secondary); line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }

        .empty-state { text-align: center; padding: 4rem 2rem; background: var(--bg-medium); border-radius: 16px; box-shadow: 0 8px 24px var(--shadow-light); border: 1px solid var(--border); }
        .empty-state-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
        .empty-state-text { color: var(--text-secondary); font-size: 1.1rem; }

        .topic-filters { background: var(--bg-medium); padding: 1.5rem; border-radius: 16px; box-shadow: 0 8px 24px var(--shadow-light); margin-bottom: 2rem; border: 1px solid var(--border); transition: background 0.35s ease; }
        .topic-filters-title { font-weight: 600; margin-bottom: 1rem; color: var(--text-primary); font-size: 0.9rem; letter-spacing: 1px; text-transform: uppercase; }
        .topic-checkboxes { display: flex; flex-wrap: wrap; gap: 1rem; }
        .topic-checkbox { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        .topic-checkbox input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--green); }
        .topic-checkbox label { cursor: pointer; user-select: none; color: var(--text-secondary); transition: color 0.2s ease; }
        .topic-checkbox:hover label { color: var(--green); }

        .topic-tag { display: inline-block; background: var(--bg-light); padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.85rem; color: var(--green); margin-left: 0.5rem; border: 1px solid var(--border); }

        .search-bar { margin-bottom: 2rem; }
        .search-bar input { width: 100%; padding: 0.875rem 1rem; background: var(--bg-medium); border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: 'Montserrat', sans-serif; transition: all 0.3s ease; color: var(--text-primary); }
        .search-bar input:focus { outline: none; border-color: var(--green); background: var(--bg-light); }
        .search-bar input::placeholder { color: var(--text-secondary); }

        input[type="file"] { display: none; }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            h1 { font-size: 2rem; }
            .prompt-form { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="theme-toggle-wrap">
            <a class="back-link" href="index.html" title="Back to index">←</a>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Switch theme">
                <span class="toggle-icon" id="themeIcon">☀️</span>
                <span id="themeLabel">Light mode</span>
            </button>
        </div>

        <header>
            <h1>Prompt Manager</h1>
            <p class="subtitle">Organize and manage your prompts - Auto-saved locally</p>
        </header>

        <div class="actions">
            <button class="btn-primary" onclick="toggleForm()">+ New Prompt</button>
            <button class="btn-secondary" onclick="exportCSV()">↓ Export CSV</button>
            <button class="btn-secondary" onclick="document.getElementById('importFile').click()">↑ Import CSV</button>
            <input type="file" id="importFile" accept=".csv" onchange="importCSV(event)">
        </div>

        <div class="topic-filters" id="topicFilters" style="display: none;"></div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search prompts by title or content..." oninput="handleSearch()"/>
        </div>

        <div class="prompt-form" id="promptForm" style="display: none;">
            <input type="text" id="promptTitle" placeholder="Prompt title" />
            <input type="text" id="promptTopic" placeholder="Topic (optional)" />
            <textarea id="promptContent" placeholder="Prompt content" oninput="autoResizeTextarea()" style="min-height: 120px;"></textarea>
            <div style="display: flex; gap: 1rem;">
                <button class="btn-primary" onclick="savePrompt()">Save</button>
                <button class="btn-secondary" onclick="toggleForm()">× Cancel</button>
            </div>
        </div>

        <div class="prompts-list" id="promptsList"></div>
    </div>

    <script>
        let prompts = [];
        let editingIndex = -1;
        let activeTopics = new Set();
        let selectedTopics = new Set();
        let searchTerm = '';

        /* THEME */
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');
            if (theme === 'light') {
                icon.textContent = '🌙';
                label.textContent = 'Dark mode';
            } else {
                icon.textContent = '☀️';
                label.textContent = 'Light mode';
            }
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        (function initTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            applyTheme(saved);
        })();

        /* PROMPTS */
        function loadPrompts() {
            try {
                const data = localStorage.getItem('prompts');
                if (data) {
                    prompts = JSON.parse(data);
                    prompts = prompts.map(p => ({ ...p, topic: p.topic || '' }));
                }
            } catch (e) { prompts = []; }
            updateTopics();
            renderPrompts();
        }

        function saveToCache() {
            try { localStorage.setItem('prompts', JSON.stringify(prompts)); }
            catch (e) { alert('Error saving. Storage might be full.'); }
        }

        function updateTopics() {
            activeTopics = new Set();
            prompts.forEach(p => { if (p.topic && p.topic.trim()) activeTopics.add(p.topic.trim()); });
            selectedTopics = new Set([...selectedTopics].filter(t => activeTopics.has(t)));
            renderTopicFilters();
        }

        function renderTopicFilters() {
            const container = document.getElementById('topicFilters');
            if (activeTopics.size === 0) { container.style.display = 'none'; return; }
            container.style.display = 'block';
            const topicsArray = Array.from(activeTopics).sort();
            container.innerHTML = `
                <div class="topic-filters-title">Filter by Topic:</div>
                <div class="topic-checkboxes">
                    ${topicsArray.map(topic => `
                        <div class="topic-checkbox">
                            <input type="checkbox" id="topic-${topic}"
                                ${selectedTopics.has(topic) ? 'checked' : ''}
                                onchange="toggleTopic('${topic.replace(/'/g, "\\'")}')"/>
                            <label for="topic-${topic}">${escapeHtml(topic)}</label>
                        </div>`).join('')}
                </div>`;
        }

        function toggleTopic(topic) {
            if (selectedTopics.has(topic)) selectedTopics.delete(topic);
            else selectedTopics.add(topic);
            renderPrompts();
        }

        function handleSearch() {
            searchTerm = document.getElementById('searchInput').value.toLowerCase();
            renderPrompts();
        }

        function toggleForm() {
            const form = document.getElementById('promptForm');
            if (form.style.display !== 'none') { form.style.display = 'none'; clearForm(); }
            else { form.style.display = 'block'; document.getElementById('promptTitle').focus(); }
        }

        function clearForm() {
            document.getElementById('promptTitle').value = '';
            document.getElementById('promptTopic').value = '';
            document.getElementById('promptContent').value = '';
            document.getElementById('promptContent').style.height = '120px';
            editingIndex = -1;
        }

        function savePrompt() {
            const title = document.getElementById('promptTitle').value.trim();
            const topic = document.getElementById('promptTopic').value.trim();
            const content = document.getElementById('promptContent').value.trim();
            if (!title || !content) { alert('Please complete title and content fields'); return; }
            const prompt = { title, topic, content };
            if (editingIndex >= 0) { prompts[editingIndex] = prompt; editingIndex = -1; }
            else prompts.unshift(prompt);
            saveToCache(); updateTopics(); renderPrompts(); toggleForm();
        }

        function editPrompt(index) {
            const prompt = prompts[index];
            document.getElementById('promptTitle').value = prompt.title;
            document.getElementById('promptTopic').value = prompt.topic || '';
            document.getElementById('promptContent').value = prompt.content;
            editingIndex = index;
            document.getElementById('promptForm').style.display = 'block';
            document.getElementById('promptTitle').focus();
            autoResizeTextarea();
        }

        function autoResizeTextarea() {
            const textarea = document.getElementById('promptContent');
            textarea.style.height = 'auto';
            textarea.style.height = Math.max(120, textarea.scrollHeight) + 'px';
        }

        function deletePrompt(index) {
            if (confirm('Are you sure you want to delete this prompt?')) {
                prompts.splice(index, 1);
                saveToCache(); updateTopics(); renderPrompts();
            }
        }

        function copyPrompt(content) {
            navigator.clipboard.writeText(content)
                .then(() => alert('Prompt copied to clipboard'))
                .catch(() => alert('Error copying prompt'));
        }

        function renderPrompts() {
            const list = document.getElementById('promptsList');
            let filteredPrompts = prompts;
            if (selectedTopics.size > 0)
                filteredPrompts = prompts.filter(p => p.topic && selectedTopics.has(p.topic.trim()));
            if (searchTerm)
                filteredPrompts = filteredPrompts.filter(p =>
                    p.title.toLowerCase().includes(searchTerm) || p.content.toLowerCase().includes(searchTerm));

            if (filteredPrompts.length === 0) {
                let message = 'No prompts saved. Create your first prompt!';
                if (searchTerm) message = `No prompts found matching "${searchTerm}".`;
                else if (selectedTopics.size > 0) message = 'No prompts found for selected topics.';
                list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">∅</div><p class="empty-state-text">${message}</p></div>`;
                return;
            }

            list.innerHTML = filteredPrompts.map((prompt) => {
                const firstLine = prompt.content.split('\n')[0];
                const preview = firstLine.length > 100 ? firstLine.substring(0, 100) + '...' : firstLine;
                const index = prompts.indexOf(prompt);
                const topicTag = prompt.topic ? `<span class="topic-tag">${escapeHtml(prompt.topic)}</span>` : '';
                return `
                <div class="prompt-card">
                    <div class="prompt-header">
                        <div class="prompt-title">${escapeHtml(prompt.title)}${topicTag}</div>
                        <div class="prompt-actions">
                            <button class="btn-icon" onclick="copyPrompt(\`${escapeHtml(prompt.content).replace(/\`/g, '\\\`')}\`)" title="Copy">&#x2398;</button>
                            <button class="btn-icon edit-icon" onclick="editPrompt(${index})" title="Edit">&#x270e;</button>
                            <button class="btn-icon btn-delete" onclick="deletePrompt(${index})" title="Delete">&times;</button>
                        </div>
                    </div>
                    <div class="prompt-content">${escapeHtml(preview)}</div>
                </div>`;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function exportCSV() {
            if (prompts.length === 0) { alert('No prompts to export'); return; }
            const csvContent = prompts.map(p => {
                const t = `"${p.title.replace(/"/g,'""')}"`;
                const c = `"${p.content.replace(/"/g,'""')}"`;
                const o = `"${(p.topic||'').replace(/"/g,'""')}"`;
                return `${t},${c},${o}`;
            }).join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', `prompts_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const imported = [];
                let currentLine = '', inQuotes = false, lines = [];
                for (let i = 0; i < content.length; i++) {
                    const char = content[i], nextChar = content[i+1];
                    if (char === '"' && nextChar === '"') { currentLine += '"'; i++; }
                    else if (char === '"') { inQuotes = !inQuotes; currentLine += char; }
                    else if (char === '\n' && !inQuotes) { if (currentLine.trim()) lines.push(currentLine); currentLine = ''; }
                    else currentLine += char;
                }
                if (currentLine.trim()) lines.push(currentLine);
                lines.forEach(line => {
                    if (!line.trim()) return;
                    const m3 = line.match(/^"((?:[^"]|"")*)","((?:[^"]|"")*)","((?:[^"]|"")*)"$/);
                    const m2 = line.match(/^"((?:[^"]|"")*)","((?:[^"]|"")*)"$/);
                    const matches = m3 || m2;
                    if (matches) {
                        const title = matches[1].replace(/""/g,'"').trim();
                        const promptContent = matches[2].replace(/""/g,'"').trim();
                        const topic = matches[3] ? matches[3].replace(/""/g,'"').trim() : '';
                        if (title && promptContent) imported.push({ title, content: promptContent, topic });
                    }
                });
                if (imported.length > 0) {
                    if (confirm(`Import ${imported.length} prompt(s)? This will add them to your existing prompts.`)) {
                        prompts = [...imported, ...prompts];
                        saveToCache(); updateTopics(); renderPrompts();
                        alert(`${imported.length} prompt(s) imported successfully`);
                    }
                } else alert('No valid prompts found in file');
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        loadPrompts();
    </script>
</body>
</html>
