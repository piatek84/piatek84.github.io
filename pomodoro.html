<style>
  :root{
    --bg:#0f0f10;

  [data-theme="light"]{

    --border:#e2e2e4;
    --text:#1a1a1c;

  *{box-sizing:border-box;}
  body{

  main{
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    gap:14px;

  .modes{
    display:flex;
    gap:8px;
    justify-content:center;

  .mode-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:999px;
    padding:7px 16px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:color .15s,border-color .15s,background .15s;

  .mode-btn:hover{color:var(--text);border-color:var(--muted);}
  .mode-btn.active{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  .timer-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:40px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  .time{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:64px;
    font-weight:600;
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  .progress-wrap{
    width:100%;
    height:6px;
    background:var(--border);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:var(--text);
    border-radius:999px;
    transition:width .3s linear;
  }
  .session-count{
    font-size:12px;
    color:var(--muted);
  }
  .buttons{
    display:flex;
    justify-content:center;
    gap:10px;

  button.action{
    background:var(--text);

  button.action:hover{opacity:.85;}
  button.action.secondary{
    background:none;
    color:var(--text);
    border:1px solid var(--border);
  }
  .settings{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    display:flex;
    flex-direction:column;

  .settings-row{
    display:flex;
    align-items:center;

<body>

<div class="top">
  <h1>Pomodoro</h1>
  <button class="toggle" id="themeToggle" title="Toggle theme">🌙</button>
</div>

<p class="subtitle">Focus timer with work and break intervals — free, fast, and private.</p>

<main>
  <div class="modes">
    <button class="mode-btn active" data-mode="work">Focus</button>
    <button class="mode-btn" data-mode="short">Short break</button>
    <button class="mode-btn" data-mode="long">Long break</button>
  </div>

  <div class="timer-panel">
    <div class="time" id="time">25:00</div>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="session-count" id="sessionCount">Sessions completed: 0</div>
    <div class="buttons">
      <button class="action" id="startBtn">Start</button>
      <button class="action secondary" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="settings">
    <div class="settings-row">
      <label for="workInput">Focus (minutes)</label>
      <input type="number" id="workInput" min="1" max="180" value="25">
    </div>
    <div class="settings-row">
      <label for="shortInput">Short break (minutes)</label>
      <input type="number" id="shortInput" min="1" max="60" value="5">
    </div>
    <div class="settings-row">
      <label for="longInput">Long break (minutes)</label>
      <input type="number" id="longInput" min="1" max="90" value="15">
    </div>
  </div>
</main>

<footer>
  <a class="kofi" href="https://ko-fi.com/jankorwer" target="_blank" rel="noopener" title="Buy me a coffee">

      <line x1="13.2" y1="2" x2="11.7" y2="6"/>
      <rect x="5" y="6" width="14" height="3" rx="1.4"/>
      <path d="M6 9 L7 20 Q7.2 21 8.2 21 L15.8 21 Q16.8 21 17 20 L18 9 Z"/>
      <line x1="6.7" y1="14" x2="17.3" y2="14"/>
    </svg>

  </a>
</footer>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(theme){
    if(theme === 'light'){
      root.setAttribute('data-theme','light');
      themeToggle.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      themeToggle.textContent = '🌙';
    }
  }

  const timeEl = document.getElementById('time');
  const progressBar = document.getElementById('progressBar');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const sessionCountEl = document.getElementById('sessionCount');
  const modeButtons = document.querySelectorAll('.mode-btn');
  const workInput = document.getElementById('workInput');
  const shortInput = document.getElementById('shortInput');
  const longInput = document.getElementById('longInput');

  let mode = 'work';
  let sessionsCompleted = 0;
  let totalSeconds = getDurationForMode(mode) * 60;
  let remainingSeconds = totalSeconds;
  let running = false;
  let endTime = null;

  const tickerWorker = (() => {
    const workerCode = `
      let intervalId = null;
      self.onmessage = function(e){
        if(e.data === 'start'){
          clearInterval(intervalId);
          intervalId = setInterval(() => self.postMessage('tick'), 250);
        } else if(e.data === 'stop'){
          clearInterval(intervalId);
        }
      };
    `;
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    return new Worker(URL.createObjectURL(blob));
  })();
  tickerWorker.onmessage = () => { if(running) tick(); };

  function getDurationForMode(m){
    if(m === 'work') return parseInt(workInput.value, 10) || 25;
    if(m === 'short') return parseInt(shortInput.value, 10) || 5;
    return parseInt(longInput.value, 10) || 15;
  }

  function formatTime(seconds){
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateDisplay(){
    timeEl.textContent = formatTime(remainingSeconds);
    const pct = totalSeconds > 0 ? ((totalSeconds - remainingSeconds) / totalSeconds) * 100 : 0;
    progressBar.style.width = pct + '%';
    document.title = running ? `${formatTime(remainingSeconds)} — Pomodoro` : 'Pomodoro Timer Online — Free, Fast, No Ads';
  }

  function switchMode(newMode, resetTimer = true){
    mode = newMode;
    modeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
    if(resetTimer){
      pause();
      totalSeconds = getDurationForMode(mode) * 60;
      remainingSeconds = totalSeconds;
      updateDisplay();
    }
  }

  function tick(){
    remainingSeconds = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    updateDisplay();
    if(remainingSeconds <= 0){
      pause();
      handleSessionComplete();
    }
  }

  function handleSessionComplete(){
    if(mode === 'work'){
      sessionsCompleted++;
      sessionCountEl.textContent = `Sessions completed: ${sessionsCompleted}`;
      const nextMode = sessionsCompleted % 4 === 0 ? 'long' : 'short';
      switchMode(nextMode);
    } else {
      switchMode('work');
    }
    playChime();
  }

  function playChime(){
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const masterGain = ctx.createGain();
      masterGain.gain.value = 0.9;
      masterGain.connect(ctx.destination);

      const notes = [880, 1108.73, 1318.51];
      notes.forEach((freq, i) => {
        const startTime = ctx.currentTime + i * 0.16;
        const duration = 0.9;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(masterGain);
        osc.type = 'sine';
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.5, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.start(startTime);
        osc.stop(startTime + duration);
      });
    } catch(e) {}
  }

  const keepAliveAudio = createKeepAliveAudio();

  function createKeepAliveAudio(){
    const sampleRate = 8000;
    const frameCount = sampleRate; // 1 second, looped
    const buffer = new ArrayBuffer(44 + frameCount * 2);
    const view = new DataView(buffer);

    function writeString(offset, str){
      for(let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + frameCount * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, frameCount * 2, true);

    for(let i = 0; i < frameCount; i++){
      const sample = Math.round((Math.random() * 2 - 1) * 300);
      view.setInt16(44 + i * 2, sample, true);
    }

    const blob = new Blob([buffer], { type: 'audio/wav' });
    const audio = new Audio(URL.createObjectURL(blob));
    audio.loop = true;
    audio.volume = 0.03;
    return audio;
  }

  function start(){
    if(running) return;
    running = true;
    startBtn.textContent = 'Pause';
    endTime = Date.now() + remainingSeconds * 1000;
    tickerWorker.postMessage('start');
    keepAliveAudio.play().catch(() => {});
  }

  function pause(){
    running = false;
    startBtn.textContent = 'Start';
    tickerWorker.postMessage('stop');
    keepAliveAudio.pause();
    updateDisplay();
  }

  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && running){
      tick();
    }
  });

  startBtn.addEventListener('click', () => {
    if(running) pause();
    else start();
  });

  resetBtn.addEventListener('click', () => {
    pause();
    totalSeconds = getDurationForMode(mode) * 60;
    remainingSeconds = totalSeconds;
    updateDisplay();
  });

  modeButtons.forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });

  [workInput, shortInput, longInput].forEach(input => {
    input.addEventListener('change', () => {
      if(!running && input === (mode === 'work' ? workInput : mode === 'short' ? shortInput : longInput)){
        totalSeconds = getDurationForMode(mode) * 60;
        remainingSeconds = totalSeconds;
        updateDisplay();
      }
    });
  });

  updateDisplay();
</script>

</body>
