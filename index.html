<style>
  :root{
    --bg:#0f0f10;
    --panel:#1a1a1c;
    --border:#2c2c2e;
    --text:#e8e8ea;
    --muted:#8a8a8e;
  }
  [data-theme="light"]{
    --bg:#fafafa;
    --panel:#ffffff;
    --border:#e2e2e4;
    --text:#1a1a1c;
    --muted:#6b6b6f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 24px;
    transition:background .2s,color .2s;
  }
  .top{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
  }
  h1{
    margin:0;
    font-size:18px;
    font-weight:600;
    letter-spacing:.2px;
  }
  .toggle{
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:8px;
    width:36px;
    height:36px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
  }
  .toggle:hover{color:var(--text);border-color:var(--muted);}
  main{
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  a.link-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    transition:border-color .15s,transform .1s;
  }
  a.link-row:hover{
    border-color:var(--muted);
  }
  a.link-row svg.file-icon{
    width:16px;
    height:16px;
    flex-shrink:0;
    color:var(--muted);
  }
  a.link-row .arrow{
    margin-left:auto;
    color:var(--muted);
    font-size:14px;
  }
  footer{
    width:100%;
    max-width:520px;
    margin-top:40px;
    display:flex;
    justify-content:flex-end;
  }
  .kofi{
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px 14px;
    border-radius:999px;
    color:var(--muted);
    text-decoration:none;
    border:1px solid var(--border);
    font-size:13px;
    font-weight:500;
    transition:color .15s,border-color .15s;
  }
  .kofi:hover{color:var(--text);border-color:var(--muted);}
  .kofi svg{width:16px;height:16px;flex-shrink:0;}
</style>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

  themeToggle.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
    localStorage.setItem('theme', next);
  });

  function applyTheme(theme){
    if(theme === 'light'){
      root.setAttribute('data-theme','light');
      themeToggle.textContent = '☀️';
    } else {
      root.removeAttribute('data-theme');
      themeToggle.textContent = '🌙';
    }
  }
</script>
